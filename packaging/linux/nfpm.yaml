# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh.
name: ${NFPM_NAME}
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: editors
priority: optional
maintainer: ${GRAMMARCRAFT_MAINTAINER}
vendor: ArtCraft Team
homepage: https://getartcraft.com/apps/grammarcraft
license: MIT OR Apache-2.0
description: |-
  Clean-room, privacy-first writing assistant and grammar checker.
  Checks spelling, grammar, contextual paronyms, regional variants, clarity,
  style, readability, tone, local similarity, and academic citations.
  Includes grammarcraft-cli for headless checks, commands, and MCP stdio dispatch.

overrides:
  deb:
    depends:
      - libc6 (>= @GLIBC_FLOOR@)
      - libgcc-s1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libvulkan1 | libegl1
    recommends:
      - mesa-vulkan-drivers
      - libegl-mesa0
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/${NFPM_BIN}
    dst: /usr/bin/${NFPM_BIN}
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/${NFPM_CLI}
    dst: /usr/bin/${NFPM_CLI}
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/lib/
    dst: /usr/lib/
    type: tree
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
