[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/grammarcraft", "apps/grammarcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/batistalucasv/grammarcraft"

# Every internal crate is listed here once, so a version bump or a new shared
# dependency is one edit. Members reach them with `{ workspace = true }`.
[workspace.dependencies]
grammarcraft-core = { path = "crates/core" }
grammarcraft-rules = { path = "crates/rules" }
grammarcraft-engine = { path = "crates/engine" }

craft-proof = { git = "https://github.com/storytold/craft-libs", rev = "8be80b006888ae023d61eed265241c9b78b84981" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8be80b006888ae023d61eed265241c9b78b84981" }
craft-docx = { git = "https://github.com/storytold/craft-libs", rev = "8be80b006888ae023d61eed265241c9b78b84981" }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "8be80b006888ae023d61eed265241c9b78b84981" }
craft = { git = "https://github.com/storytold/craft-libs", rev = "8be80b006888ae023d61eed265241c9b78b84981", default-features = false }
craft-ai-core = { git = "https://github.com/storytold/craft-ai-integrations", rev = "a822ad5b4db2c0dcd7a43bb62d6d75251fd3f8b5" }
craft-ai-openai = { git = "https://github.com/storytold/craft-ai-integrations", rev = "a822ad5b4db2c0dcd7a43bb62d6d75251fd3f8b5" }
craft-ai-client = { git = "https://github.com/storytold/craft-ai-integrations", rev = "a822ad5b4db2c0dcd7a43bb62d6d75251fd3f8b5" }
craft-ai-native = { git = "https://github.com/storytold/craft-ai-integrations", rev = "a822ad5b4db2c0dcd7a43bb62d6d75251fd3f8b5" }

egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `unsafe_code = "forbid"` is a workspace lint, not a per-crate attribute: a
# crate cannot opt out of it by forgetting to add `[lints] workspace = true`
# *and* opting in here is the only way to get the clippy rules below.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
# A type this long is a fact of the domain (a handler signature), not debt.
type_complexity = "allow"

# Dependencies are optimised even in a debug build, while our own crates keep
# fast rebuilds. Line tables only: full debug info for every dependency
# multiplies the target directory.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
emath = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
